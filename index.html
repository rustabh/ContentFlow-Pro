<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c0a14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Incinc CRM" />
<title>Incinc CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#0c0a14; --bg2:#110d1c; --surface:#181327; --surface-2:#211a3a;
    --line:rgba(255,255,255,.085); --line-soft:rgba(255,255,255,.05);
    --text:#ECE9F5; --muted:#9a93b5; --muted-2:#6f6890;
    --b1:#5418c4; --b2:#8a17b3; --b3:#c81e8e;
    --accent:#a21bca; --accent-2:#c81e8e; --accent-soft:rgba(162,27,202,.16);
    --grad:linear-gradient(120deg,#5b1ec9 0%,#8e1bb0 48%,#c81e8e 100%);
    --green:#34d399; --green-soft:rgba(52,211,153,.15);
    --red:#fb7185; --red-soft:rgba(251,113,133,.15);
    --blue:#60a5fa; --blue-soft:rgba(96,165,250,.15);
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,.15);
    --r:16px; --r-sm:11px;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.7);
    --display:"Fraunces",Georgia,serif; --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--ui); color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45}
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:
    radial-gradient(900px 500px at 12% -8%, rgba(91,30,201,.20), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(200,30,142,.14), transparent 55%); pointer-events:none}
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--text)}
  a{color:inherit}
  ::selection{background:var(--accent); color:#fff}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
  .grad-text{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}

  .app{display:grid; grid-template-columns:236px 1fr; min-height:100vh}
  .side{border-right:1px solid var(--line); background:rgba(17,13,28,.7); backdrop-filter:blur(10px); padding:18px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:3px}
  .brand{padding:6px 8px 16px}
  .brand img{width:100%; height:auto; display:block; background:#fff; border-radius:12px; padding:10px 12px; box-shadow:0 2px 14px rgba(162,27,202,.28)}
  .brand .tag{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted-2); margin-top:8px; font-weight:600}
  .nav{display:flex; flex-direction:column; gap:2px; margin-top:6px}
  .nav button{display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:9px 11px; border-radius:var(--r-sm); color:var(--muted); font-weight:500; font-size:13.5px; transition:.13s}
  .nav button svg{width:18px; height:18px; flex:none; opacity:.8}
  .nav button:hover{background:var(--surface-2); color:var(--text)}
  .nav button.on{background:var(--accent-soft); color:#fff}
  .nav button.on svg{opacity:1; color:var(--accent-2)}
  .side .spacer{flex:1}
  .side .foot{font-size:11px; color:var(--muted-2); padding:10px 8px; border-top:1px solid var(--line-soft); line-height:1.5}

  .main{min-width:0; display:flex; flex-direction:column}
  .topbar{position:sticky; top:0; z-index:20; background:rgba(12,10,20,.82); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:14px 26px}
  .topbar-row{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
  .page-title{font-family:var(--display); font-size:25px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
  .page-sub{color:var(--muted); font-size:12.5px; margin-top:2px}
  .top-actions{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}

  .band{display:flex; margin-top:14px; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
  .band .net{padding:13px 18px; background:var(--grad); color:#fff; flex:none; min-width:180px; display:flex; flex-direction:column; justify-content:center}
  .band .net .lbl{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.82)}
  .band .net .val{font-family:var(--display); font-size:26px; font-weight:600; margin-top:2px}
  .band .accts{display:flex; flex:1; min-width:0; overflow-x:auto}
  .band .acct{padding:13px 16px; border-left:1px solid var(--line-soft); flex:1; min-width:130px; display:flex; flex-direction:column; gap:3px}
  .band .acct .top{display:flex; align-items:center; gap:7px}
  .band .acct .dot{width:8px; height:8px; border-radius:50%; flex:none}
  .band .acct .nm{font-size:11.5px; color:var(--muted); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .band .acct .bal{font-family:var(--display); font-size:18px; font-weight:600}

  .btn{display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:11px; font-weight:600; font-size:13px; border:1px solid var(--line); background:var(--surface); color:var(--text); transition:.1s; white-space:nowrap}
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--grad); color:#fff; border:none}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.green{background:var(--green); color:#06281d; border:none}
  .btn.red{background:var(--red); color:#3a0d16; border:none}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px; font-size:12px; border-radius:9px}
  .x{width:32px; height:32px; border-radius:9px; display:grid; place-items:center; color:var(--muted)}
  .x:hover{background:var(--surface-2)}

  .content{padding:22px 26px 110px; max-width:1180px; width:100%}
  .grid{display:grid; gap:14px}
  .cards{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
  .stat .lbl{font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px}
  .stat .val{font-family:var(--display); font-size:27px; font-weight:600; letter-spacing:-.02em; margin-top:7px; line-height:1}
  .stat .meta{font-size:11.5px; color:var(--muted); margin-top:6px}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px}
  .pos{color:var(--green); background:var(--green-soft)} .neg{color:var(--red); background:var(--red-soft)} .warnp{color:var(--amber); background:var(--amber-soft)}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px; gap:10px; flex-wrap:wrap}
  .section-head .eyebrow{font-family:var(--display); font-size:18px; font-weight:600}
  .section-head .link{font-size:12.5px; color:var(--accent-2); font-weight:600}
  .two{grid-template-columns:1.4fr 1fr}
  .chart-card h4,.panel h4{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 14px; font-weight:600; display:flex; align-items:center; gap:7px}
  .chart-card h4 svg,.panel h4 svg{width:15px;height:15px}

  table{width:100%; border-collapse:collapse}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted-2); font-weight:600; padding:0 12px 9px}
  td{padding:11px 12px; border-top:1px solid var(--line-soft); font-size:13px; vertical-align:middle}
  tr.row:hover td{background:rgba(255,255,255,.025)}
  .t-amt{text-align:right; font-weight:600}
  .t-acct{font-size:11.5px; color:var(--muted)}
  .chip{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600}
  .chip.paid,.chip.active{background:var(--green-soft); color:var(--green)}
  .chip.pending{background:var(--amber-soft); color:var(--amber)}
  .chip.overdue,.chip.lost{background:var(--red-soft); color:var(--red)}
  .chip.partial{background:var(--blue-soft); color:var(--blue)}
  .chip.inactive{background:var(--surface-2); color:var(--muted)}
  .chip.completed{background:var(--accent-soft); color:#d6a8ea}

  .empty{padding:38px 20px; text-align:center; color:var(--muted)}
  .empty .big{font-family:var(--display); font-size:18px; color:var(--text); margin-bottom:4px}
  .alert-item{display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--line-soft)}
  .alert-item:first-of-type{border-top:none}
  .alert-item .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
  .alert-item .txt{flex:1;min-width:0}
  .alert-item .txt .t1{font-weight:600;font-size:13px} .alert-item .txt .t2{font-size:11.5px;color:var(--muted)}

  .overlay{position:fixed; inset:0; background:rgba(6,5,12,.6); backdrop-filter:blur(3px); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto}
  .overlay.show{display:flex}
  .modal{background:var(--surface); border:1px solid var(--line); border-radius:18px; width:100%; max-width:560px; box-shadow:0 30px 80px -20px rgba(0,0,0,.8); animation:pop .18s ease; margin:auto 0}
  .modal.wide{max-width:820px}
  @keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0} to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.modal{animation:none}}
  .modal .mh{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line-soft)}
  .modal .mh h3{margin:0; font-family:var(--display); font-size:20px; font-weight:600}
  .modal .mb{padding:20px 22px} .modal .mf{padding:16px 22px; border-top:1px solid var(--line-soft); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}

  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg2); color:var(--text); transition:.12s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .field textarea{resize:vertical; min-height:62px}
  .field select option{background:var(--bg2)}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px} .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
  .acct-pick{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .acct-opt{border:1px solid var(--line); border-radius:11px; padding:11px 13px; display:flex; align-items:center; gap:9px; transition:.12s; background:var(--bg2)}
  .acct-opt:hover{background:var(--surface-2)}
  .acct-opt.sel{border-color:var(--accent); background:var(--accent-soft)}
  .acct-opt .dot{width:9px;height:9px;border-radius:50%}
  .acct-opt .ainfo{flex:1;min-width:0}
  .acct-opt .an{font-size:12.5px;font-weight:600} .acct-opt .ab{font-size:11px;color:var(--muted)}

  .toast{position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-2); border:1px solid var(--line); color:#fff; padding:11px 18px; border-radius:12px; font-size:13px; font-weight:500; z-index:200; opacity:0; transition:.25s; box-shadow:var(--shadow); pointer-events:none}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* attendance grid */
  .att-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .att-cell{aspect-ratio:1; border-radius:9px; border:1px solid var(--line); background:var(--bg2); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:.1s; font-size:11px}
  .att-cell .dnum{font-size:11px; color:var(--muted-2); font-weight:600}
  .att-cell .mk{font-size:13px; font-weight:700; margin-top:1px}
  .att-cell.future{opacity:.4; pointer-events:none}
  .att-cell.dow{aspect-ratio:auto; border:none; background:none; color:var(--muted-2); font-size:10px; text-transform:uppercase; cursor:default; padding-bottom:2px}
  .att-P{background:var(--green-soft); border-color:transparent; color:var(--green)}
  .att-L{background:var(--amber-soft); border-color:transparent; color:var(--amber)}
  .att-H{background:var(--blue-soft); border-color:transparent; color:var(--blue)}
  .att-A{background:var(--red-soft); border-color:transparent; color:var(--red)}
  .att-W{background:var(--surface-2); border-color:transparent; color:var(--muted)}
  .qbtn{padding:4px 9px; border-radius:8px; font-size:11px; font-weight:700; border:1px solid var(--line); background:var(--bg2); color:var(--muted)}
  .qbtn.qP{color:var(--green)} .qbtn.qL{color:var(--amber)} .qbtn.qH{color:var(--blue)} .qbtn.qA{color:var(--red)} .qbtn.qW{color:var(--muted)}
  .qbtn.on{outline:2px solid currentColor; outline-offset:-1px}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:12px}
  .legend span{display:flex; align-items:center; gap:6px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .month-nav{display:inline-flex; align-items:center; gap:4px; background:var(--bg2); border:1px solid var(--line); border-radius:11px; padding:3px}
  .month-nav button{width:30px;height:30px;border-radius:8px;color:var(--muted)} .month-nav button:hover{background:var(--surface-2);color:var(--text)}
  .month-nav .m{font-weight:600; padding:0 8px; min-width:130px; text-align:center}

  .gs-item{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px;cursor:pointer}
  .gs-item:hover{background:var(--surface-2)}
  .gs-item .ico{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;flex:none}
  .gs-item .ico svg{width:16px;height:16px}
  .gs-item .t1{font-weight:600;font-size:13px}
  .gs-item .t2{font-size:11.5px;color:var(--muted)}
  .mobile-tabs{display:none}
  @media (max-width:880px){
    .app{grid-template-columns:1fr}
    .side{display:none}
    .content{padding:16px 14px 96px}
    .cards{grid-template-columns:repeat(2,1fr)}
    .two{grid-template-columns:1fr}
    .topbar{padding:12px 14px}
    .row2,.row3,.acct-pick{grid-template-columns:1fr}
    .mobile-tabs{display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50; background:rgba(17,13,28,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:6px 6px calc(8px + env(safe-area-inset-bottom)); overflow-x:auto}
    .mobile-tabs button{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10px; font-weight:600; padding:5px 11px; border-radius:10px; flex:none}
    .mobile-tabs button svg{width:20px;height:20px}
    .mobile-tabs button.on{color:#fff}
    .mobile-tabs button.on svg{color:var(--accent-2)}
    .mtop-logo{height:26px}
  }
  .x svg{width:16px;height:16px}
  .segbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content;max-width:100%}
  .seg{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
  .seg:hover{color:var(--text)}
  .seg.on{background:var(--accent-soft);color:#fff}
  .segn{font-size:10.5px;background:var(--surface-2);color:var(--muted);padding:1px 6px;border-radius:999px;margin-left:3px}
  .seg.on .segn{background:rgba(255,255,255,.18);color:#fff}
  .tline{position:relative;padding-left:22px}
  .tline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .titem{position:relative;padding:0 0 16px}
  .titem::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
  .titem:last-child{padding-bottom:0}
  .titem .td{font-size:11px;color:var(--muted-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .titem .tn{font-size:13px;margin-top:3px}
  .titem .tr{font-size:12.5px;color:var(--muted);margin-top:3px;padding:7px 10px;background:var(--bg2);border-radius:9px}
  .statusbtns{display:flex;gap:5px;flex-wrap:wrap}
  .statusbtns .sb{padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--bg2);color:var(--muted)}
  .statusbtns .sb.on{background:var(--accent-soft);color:#fff;border-color:transparent}
  .hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,rgba(91,30,201,.20),rgba(200,30,142,.14));border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin-bottom:16px}
  .hero .hgreet{font-family:var(--display);font-size:22px;font-weight:600}
  .hero .hsub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .hero .hsnap{display:flex;gap:26px}
  .hero .hsnap>div{display:flex;flex-direction:column}
  .hero .hk{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2)}
  .hero .hv{font-family:var(--display);font-weight:600;font-size:20px;margin-top:2px}
  .card{transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
  .card.stat:hover,.chart-card:hover{transform:translateY(-2px)}
  .btn.wa,.btn.sm.wa{background:#25d366;color:#073b1e;border-color:transparent;font-weight:700}
  .btn.wa:hover,.btn.sm.wa:hover{filter:brightness(1.06)}
  .x:hover{color:var(--text);background:var(--surface-2)}
  @media (max-width:640px){.hero{padding:15px 16px}.hero .hsnap{gap:16px}.hero .hv{font-size:16px}.hero .hgreet{font-size:18px}}
  /* professional invoice */
  .invpaper{background:#fff;color:#1a1a1a;font-size:12px;line-height:1.45}
  .invpaper *{box-sizing:border-box}
  .invtitle{text-align:center;font-weight:700;font-size:15px;letter-spacing:.06em;border:1px solid #000;padding:6px}
  .invhead{display:flex;border:1px solid #000;border-top:none}
  .invhead .invlogo{width:32%;border-right:1px solid #000;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .invhead .invlogo img{height:46px;border-radius:8px}
  .invhead .invname{font-family:var(--display);font-size:18px;font-weight:700;margin-top:6px;color:#111}
  .invhead .invtag{font-size:9.5px;color:#666;margin-top:1px}
  .invhead .invfrom{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
  .invhead .invfrom b{color:#000}
  .invmeta{display:flex;border:1px solid #000;border-top:none}
  .invmeta .invbill{flex:1;border-right:1px solid #000}
  .invmeta .invbill .lbl{text-align:center;font-weight:700;border-bottom:1px solid #000;padding:4px;background:#f2f2f2}
  .invmeta .invbill .bd{padding:8px 10px}
  .invmeta .invbill .m{font-size:13px;margin-bottom:2px}
  .invmeta .invno{width:44%}
  .invmeta .invno table{width:100%;border-collapse:collapse;height:100%}
  .invmeta .invno td{border-bottom:1px solid #000;border-left:1px solid #000;padding:5px 9px}
  .invmeta .invno td:first-child{border-left:none;font-weight:600;width:46%}
  .invmeta .invno tr:last-child td{border-bottom:none}
  table.invitems{width:100%;border-collapse:collapse;border:1px solid #000;border-top:none}
  table.invitems th{border:1px solid #000;border-top:none;background:#f2f2f2;padding:6px 5px;font-size:10px;text-transform:uppercase;letter-spacing:.02em}
  table.invitems td{border:1px solid #000;padding:7px 6px;vertical-align:top}
  table.invitems td.r,table.invitems th.r{text-align:right}
  table.invitems td.c,table.invitems th.c{text-align:center}
  .invtot{display:flex;border:1px solid #000;border-top:none}
  .invtot .invwords{flex:1;border-right:1px solid #000;padding:9px 10px;font-size:12px}
  table.invsum{width:44%;border-collapse:collapse}
  table.invsum td{padding:5px 9px;border-bottom:1px solid #000;border-left:1px solid #000}
  table.invsum td:first-child{border-left:none;font-weight:600}

/* ---- PWA: manifest + apple icon (so it installs nicely once hosted) ---- */
try{
  const mani={name:"Incinc CRM",short_name:"Incinc",start_url:".",scope:".",display:"standalone",orientation:"portrait",background_color:"#0c0a14",theme_color:"#0c0a14",icons:[{src:ICON,sizes:"384x384",type:"image/png",purpose:"any maskable"},{src:ICON,sizes:"512x512",type:"image/png"}]};
  const ml=document.createElement("link"); ml.rel="manifest";
  ml.href=URL.createObjectURL(new Blob([JSON.stringify(mani)],{type:"application/manifest+json"})); document.head.appendChild(ml);
  const al=document.createElement("link"); al.rel="apple-touch-icon"; al.href=ICON; document.head.appendChild(al);
}catch(e){}

/* ---- storage adapter ---- */
const store=(()=>{
  if(typeof window!=="undefined" && window.storage && window.storage.get){
    return {async get(){try{const r=await window.storage.get(KEY,false);return r?r.value:null}catch{return null}},
            async set(v){try{await window.storage.set(KEY,v,false)}catch(e){console.warn(e)}}};
  }
  let mem=null;
  return {async get(){try{return localStorage.getItem(KEY)}catch{return mem}},
          async set(v){try{localStorage.setItem(KEY,v)}catch{mem=v}}};
})();

const monthKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")};
const mkLabel=mk=>{const[y,m]=mk.split("-");return new Date(y,m-1,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"})};
const daysInMonth=mk=>{const[y,m]=mk.split("-").map(Number);return new Date(y,m,0).getDate()};

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function balanceOf(id){
  const a=state.accounts.find(x=>x.id===id); let b=a.opening;
  for(const t of state.transactions){
    if(t.type==="income"&&t.accountId===id)b+=t.amount;
    else if(t.type==="expense"&&t.accountId===id)b-=t.amount;
    else if(t.type==="transfer"){if(t.accountId===id)b-=t.amount;if(t.toAccountId===id)b+=t.amount}
  } return b;
}
const netWorth=()=>state.accounts.reduce((s,a)=>s+balanceOf(a.id),0);
const acctName=id=>(state.accounts.find(a=>a.id===id)||{}).name||"—";
const acctColor=id=>(state.accounts.find(a=>a.id===id)||{}).color||"#999";
const sumIncome=f=>state.transactions.filter(t=>t.type==="income"&&f(t)).reduce((s,t)=>s+t.amount,0);
const sumExpense=f=>state.transactions.filter(t=>t.type==="expense"&&f(t)).reduce((s,t)=>s+t.amount,0);

const isToday=t=>t.date===iso(today());

/* payroll */
function payrollFor(m, mk){
  const dim=daysInMonth(mk); const[y,mo]=mk.split("-").map(Number);
  let P=0,L=0,H=0,A=0,W=0,marked=0;
  for(let dd=1;dd<=dim;dd++){
    const ds=`${y}-${String(mo).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
    const s=state.attendance[m.id+"|"+ds]; if(!s)continue; marked++;
    if(s==="P")P++;else if(s==="L")L++;else if(s==="H")H++;else if(s==="A")A++;else if(s==="W")W++;
  }
  const perDay=m.salary/dim;
  const lateCut=Math.floor(L/4);
  const dedDays=A + H*0.5 + lateCut;
  const net=Math.max(0,Math.round(m.salary - perDay*dedDays));
  return {dim,P,L,H,A,W,marked,perDay,lateCut,dedDays,net};
}
const isSalaryPaid=(mid,mk)=>!!(state.salaryPaid&&state.salaryPaid[mid+"|"+mk]);

/* recurring status for a month */
function recurStatus(r, mk){
  if(r.lastPaid===mk) return "paid";
  const tdy=today(), curMk=monthKey(tdy);
  if(mk!==curMk) return r.lastPaid===mk?"paid":"due";
  const dueDate=new Date(tdy.getFullYear(),tdy.getMonth(),Math.min(r.day,daysInMonth(mk)));
  const diff=Math.round((dueDate-new Date(iso(tdy)))/86400000);
  if(diff<0) return "overdue"; if(diff===0) return "today"; return "upcoming";
}

/* ---- charts ---- */
function donut(data,size=150){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total)return `<div class="empty" style="padding:20px">No data yet</div>`;
  const r=size/2,ir=r*0.62,cx=r,cy=r;let a=-Math.PI/2,paths="";
  data.forEach(d=>{const f=d.value/total,a2=a+f*2*Math.PI,lg=f>0.5?1:0;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const xi1=cx+ir*Math.cos(a2),yi1=cy+ir*Math.sin(a2),xi2=cx+ir*Math.cos(a),yi2=cy+ir*Math.sin(a);
    paths+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${lg} 1 ${x2} ${y2} L${xi1} ${yi1} A${ir} ${ir} 0 ${lg} 0 ${xi2} ${yi2} Z" fill="${d.color}"/>`;a=a2});
  const legend=data.map(d=>`<div style="display:flex;align-items:center;gap:7px;font-size:12px;margin:4px 0"><span style="width:9px;height:9px;border-radius:2px;background:${d.color};flex:none"></span><span style="flex:1;color:var(--muted)">${esc(d.label)}</span><span class="num" style="font-weight:600">${fmtINR(d.value)}</span></div>`).join("");
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex:none">${paths}<text x="${cx}" y="${cy-3}" text-anchor="middle" style="font-family:var(--display);font-weight:600;font-size:15px;fill:var(--text)" class="num">${fmtINR(total)}</text><text x="${cx}" y="${cy+12}" text-anchor="middle" style="font-size:9px;fill:var(--muted);text-transform:uppercase;letter-spacing:.05em">total</text></svg><div style="flex:1;min-width:150px">${legend}</div></div>`;
}
function barsIE(months){

  months.forEach((m,i)=>{const x=pad/2+i*(bw+gap),ih=m.income/max*h,eh=m.expense/max*h;
    bars+=`<rect x="${x}" y="${pad+h-ih}" width="${bw/2-2}" height="${ih}" rx="3" fill="var(--green)"/>`;

  const months=[];for(let i=5;i>=0;i--){const dd=addMonths(today(),-i),k=monthKey(dd);months.push({label:dd.toLocaleDateString("en-IN",{month:"short"}),income:sumIncome(t=>inMonth(t,k)),expense:sumExpense(t=>inMonth(t,k))})}
  const catMap={};state.transactions.filter(t=>t.type==="expense"&&inMonth(t,mk)).forEach(t=>catMap[t.category]=(catMap[t.category]||0)+t.amount);
  const catData=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([l,v],i)=>({label:l,value:v,color:PALETTE[i%PALETTE.length]}));
  const acctRows=state.accounts.map(a=>({label:a.name,value:Math.max(0,balanceOf(a.id)),color:a.color}));
  const recent=[...state.transactions].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,7);

  // combined reminders: installments + recurring due + salary pending
  const tdy=iso(today());
  const rem=[];
  allInstallments().filter(i=>i.status!=="paid").forEach(i=>rem.push({label:`${i.client} · ${fmtINR(i.amount)}`,sub:`${i.service} · due ${fmtDate(i.due)}`,days:Math.round((new Date(i.due)-new Date(tdy))/86400000)}));
  state.recurring.filter(r=>r.active).forEach(r=>{const st=recurStatus(r,mk);if(["overdue","today","upcoming"].includes(st)){const dd=new Date(today().getFullYear(),today().getMonth(),Math.min(r.day,daysInMonth(mk)));rem.push({label:`${r.name} · ${fmtINR(r.amount)}`,sub:`Recurring · ${acctName(r.accountId)}`,days:Math.round((dd-new Date(tdy))/86400000)})}});
  state.team.filter(m=>m.active&&!isSalaryPaid(m.id,mk)).forEach(m=>{const p=payrollFor(m,mk);rem.push({label:`Salary · ${m.name}`,sub:`${m.department} · ${fmtINR(p.net)} net`,days:99})});
  (state.leads||[]).filter(l=>!["won","lost"].includes(l.status)&&l.nextFollowup).forEach(l=>{rem.push({label:`Follow-up · ${l.name}`,sub:`${l.service||"Lead"}${l.amount?" · "+fmtINR(l.amount):""}`,days:Math.round((new Date(l.nextFollowup)-new Date(tdy))/86400000),lead:true})});
  rem.sort((a,b)=>a.days-b.days);
  const payroll=state.team.filter(m=>m.active).reduce((s,m)=>s+payrollFor(m,mk).net,0);
  const hr=today().getHours();const greet=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";const bizName=(state.business&&state.business.name)||"Incinc";

  return `
  <div class="hero">
    <div><div class="hgreet">${greet} 👋</div><div class="hsub">${today().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})} · ${esc(bizName)}</div></div>
    <div class="hsnap"><div><span class="hk">Across accounts</span><span class="hv num">${fmtINR(netWorth())}</span></div><div><span class="hk">This month profit</span><span class="hv num" style="color:${profit>=0?"var(--green)":"var(--red)"}">${fmtINR(profit)}</span></div></div>
  </div>
  <div class="grid cards">
    ${statCard("Today's income",fmtINR(tInc),tInc?`${state.transactions.filter(t=>t.type==="income"&&isToday(t)).length} entries`:"nothing yet today")}
    ${statCard("Today's expense",fmtINR(tExp),"")}
    ${statCard("This month profit",fmtINR(profit),`${fmtINR(mInc)} in · ${fmtINR(mExp)} out`)}
    ${statCard("Pending receivables",fmtINR(pendingReceivables()),"to collect")}
  </div>
  <div class="grid cards" style="margin-top:14px;grid-template-columns:repeat(4,1fr)">
    ${statCard("This month's payroll",fmtINR(payroll),`${state.team.filter(m=>m.active).length} people`)}
    ${statCard("Recurring / month",fmtINR(state.recurring.filter(r=>r.active).reduce((s,r)=>s+r.amount,0)),`${state.recurring.filter(r=>r.active).length} items`)}
    ${statCard("Working clients",String(state.clients.filter(c=>c.status==="active").length),`${state.clients.length} total`)}
    ${statCard("Open leads",String((state.leads||[]).filter(l=>!["won","lost"].includes(l.status)).length),"in pipeline")}
  </div>

  <div class="grid two" style="margin-top:14px">
    <div class="card chart-card"><h4>${I.reports} Income vs expense · last 6 months</h4>${barsIE(months)}</div>
    <div class="card panel"><h4>${I.bell} Needs attention</h4>
      ${rem.length?rem.slice(0,6).map(a=>{const cls=a.days<0?"neg":a.days<=3?"warnp":"pos";const lbl=a.days===99?"salary":a.days<0?`${Math.abs(a.days)}d late`:a.days===0?"today":`in ${a.days}d`;
        return `<div class="alert-item"><div class="ico" style="background:${a.days<0?"var(--red-soft)":"var(--amber-soft)"};color:${a.days<0?"var(--red)":"var(--amber)"}">${I.bell}</div><div class="txt"><div class="t1">${esc(a.label)}</div><div class="t2">${esc(a.sub)}</div></div><span class="pill ${cls}">${lbl}</span></div>`}).join(""):`<div class="empty"><div class="big">All clear</div>Nothing pending.</div>`}
    </div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card chart-card"><h4>Expenses by category · this month</h4>${donut(catData)}</div>
    <div class="card chart-card"><h4>Balance by account</h4>${hbars(acctRows)}</div>
  </div>
  <div class="section-head"><span class="eyebrow">Recent activity</span><a class="link" data-action="go" data-view="ledger" href="#">Open ledger →</a></div>
  <div class="card" style="padding:6px 6px 2px">${txTable(recent,true)}</div>`;
}

function txTable(list,compact){
  if(!list.length)return `<div class="empty"><div class="big">No transactions yet</div>Add an income or expense to get started.</div>`;
  return `<table><thead><tr><th>Date</th><th>Details</th><th>Account</th><th style="text-align:right">Amount</th>${compact?"":"<th></th>"}</tr></thead><tbody>${list.map(t=>{
    let amt,label,sub;
    if(t.type==="income"){amt=`<span style="color:var(--green)">+${fmtINR(t.amount)}</span>`;label=t.client?esc(t.client):esc(t.source||"Income");sub=`${esc(t.source||"")}${t.service?" · "+esc(t.service):""}`}
    else if(t.type==="expense"){amt=`<span style="color:var(--red)">−${fmtINR(t.amount)}</span>`;label=esc(t.category);sub=esc(t.sub||t.desc||"")}
    else{amt=`<span style="color:var(--blue)">⇄ ${fmtINR(t.amount)}</span>`;label="Transfer";sub=`${acctName(t.accountId)} → ${acctName(t.toAccountId)}`}
    const at=t.type==="transfer"?"":`<span class="t-acct"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${acctColor(t.accountId)};margin-right:5px;vertical-align:middle"></span>${acctName(t.accountId)}</span>`;
    return `<tr class="row"><td style="white-space:nowrap;color:var(--muted)">${fmtDate(t.date)}</td><td><div style="font-weight:600">${label}</div>${sub?`<div style="font-size:11.5px;color:var(--muted)">${sub}</div>`:""}</td><td>${at}</td><td class="t-amt num">${amt}</td>${compact?"":`<td class="no-print" style="text-align:right;white-space:nowrap"><button class="x" data-action="editTx" data-id="${t.id}" title="Edit">${I.edit}</button><button class="x" data-action="delTx" data-id="${t.id}" title="Delete">${I.trash}</button></td>`}</tr>`;
  }).join("")}</tbody></table>`;
}
function ledgerFiltered(){
  let list=[...state.transactions].sort((a,b)=>(b.date+(b.time||"")).localeCompare(a.date+(a.time||"")));
  const ty=state.ledgerType||"all";
  if(ty!=="all")list=list.filter(t=>t.type===ty);
  const q=(state.ledgerQ||"").toLowerCase().trim();
  if(q)list=list.filter(t=>[t.date,t.category,t.sub,t.desc,t.client,t.service,t.source,acctName(t.accountId),t.toAccountId?acctName(t.toAccountId):"",String(t.amount)].join(" ").toLowerCase().includes(q));
  return list;
}
function vLedger(){
  const list=ledgerFiltered();
  const inc=sumIncome(()=>true),exp=sumExpense(()=>true);
  const ty=state.ledgerType||"all";
  const tabs=[["all","All"],["income","Income"],["expense","Expense"],["transfer","Transfers"]];
  return `<div class="grid cards" style="grid-template-columns:repeat(3,1fr)">
    ${statCard("Total income",fmtINR(inc),`${state.transactions.filter(t=>t.type==="income").length} entries`)}
    ${statCard("Total expense",fmtINR(exp),`${state.transactions.filter(t=>t.type==="expense").length} entries`)}
    ${statCard("Net",fmtINR(inc-exp),"")}</div>
    <div class="section-head"><span class="eyebrow">All transactions</span><span class="no-print" style="display:flex;gap:8px"><button class="btn sm green" data-action="addIncome">＋ Income</button><button class="btn sm red" data-action="addExpense">－ Expense</button><button class="btn sm ghost" data-action="transfer">⇄ Transfer</button></span></div>

      <input id="ledgerSearch" placeholder="Search client, category, note, amount…" value="${esc(state.ledgerQ||"")}" style="flex:1;min-width:200px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface)">

    return `<div class="card" style="margin-bottom:14px"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><div style="font-family:var(--display);font-size:17px;font-weight:600">${esc(s.name)}</div><div style="font-size:11.5px;color:var(--muted)">Started ${fmtDateY(s.start)} · ${esc(s.paymentType)}</div></div><div style="display:flex;align-items:center;gap:10px"><div style="text-align:right"><div style="font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.05em">Package</div><div class="num" style="font-family:var(--display);font-weight:600;font-size:18px">${fmtINR(s.price)}</div><div style="font-size:11.5px;color:var(--green)">${fmtINR(paid)} collected</div></div><div class="no-print" style="display:flex;gap:2px"><button class="x" data-action="editService" data-cid="${c.id}" data-sid="${s.id}" title="Edit">${I.edit}</button><button class="x" data-action="delService" data-cid="${c.id}" data-sid="${s.id}" title="Delete">${I.trash}</button></div></div></div>${smm}${(s.installments||[]).length?`<table style="margin-top:12px"><thead><tr><th>Amount</th><th>Due</th><th>Paid on</th><th>Status</th><th></th></tr></thead><tbody>${insts}</tbody></table>`:`<div style="font-size:12px;color:var(--muted);margin-top:8px">No installments tracked.</div>`}<div class="no-print" style="margin-top:10px"><button class="btn sm ghost" data-action="addInst" data-cid="${c.id}" data-sid="${s.id}">＋ Add installment</button></div></div>`;

/* ---- LEADS ---- */
function vLeads(){
  if(state.openLead)return leadDetail(state.openLead);
  const filt=state.leadFilter||"all";
  const tdy=iso(today());
  const open=state.leads.filter(l=>!["won","lost"].includes(l.status));
  const counts={};LEAD_STATUS.forEach(s=>counts[s]=state.leads.filter(l=>l.status===s).length);
  const tabs=[["all","All"],...LEAD_STATUS.map(s=>[s,LEAD_STATUS_LABEL[s]])];
  const tabBar=`<div class="segbar no-print">${tabs.map(([k,l])=>`<button class="seg ${filt===k?"on":""}" data-action="leadFilter" data-f="${k}">${l}${k!=="all"&&counts[k]?`<span class="segn">${counts[k]}</span>`:""}</button>`).join("")}</div>`;
  const totalVal=open.reduce((s,l)=>s+(l.amount||0),0);
  const won=state.leads.filter(l=>l.status==="won").length;
  const conv=state.leads.length?Math.round(won/state.leads.length*100):0;
  const dueFollow=state.leads.filter(l=>!["won","lost"].includes(l.status)&&l.nextFollowup&&l.nextFollowup<=tdy).length;
  const stats=`<div class="grid cards"><div class="card stat"><div class="lbl">Open leads</div><div class="val num">${open.length}</div><div class="meta">in the pipeline</div></div><div class="card stat"><div class="lbl">Pipeline value</div><div class="val num">${fmtINR(totalVal)}</div><div class="meta">potential</div></div><div class="card stat"><div class="lbl">Follow-ups due</div><div class="val num" style="${dueFollow?"color:var(--amber)":""}">${dueFollow}</div><div class="meta">today or overdue</div></div><div class="card stat"><div class="lbl">Conversion</div><div class="val num">${conv}%</div><div class="meta">${won} won of ${state.leads.length}</div></div></div>`;
  let list=filt==="all"?state.leads:state.leads.filter(l=>l.status===filt);
  list=[...list].sort((a,b)=>{const an=a.nextFollowup||"9999",bn=b.nextFollowup||"9999";return an.localeCompare(bn)});
  const head=`<div class="section-head"><span class="eyebrow">${list.length} lead${list.length!==1?"s":""}</span><button class="btn sm primary no-print" data-action="addLead">＋ Add lead</button></div>`;
  if(!state.leads.length)return stats+`<div class="card" style="margin-top:14px"><div class="empty"><div class="big">No leads yet</div><button class="btn primary" data-action="addLead" style="margin-top:10px">＋ Add your first lead</button></div></div>`;
  const rows=list.map(l=>{
    const src=`${esc(l.source||"—")}${l.source==="Reference"&&l.referredBy?` <span style="color:var(--muted-2)">(${esc(l.referredBy)})</span>`:""}`;
    const nf=l.nextFollowup?(l.nextFollowup<tdy?`<span style="color:var(--red)">${fmtDate(l.nextFollowup)}</span>`:l.nextFollowup===tdy?`<span style="color:var(--amber)">today</span>`:fmtDate(l.nextFollowup)):"—";
    return `<tr class="row"><td><div style="font-weight:600;cursor:pointer" data-action="openLead" data-id="${l.id}">${esc(l.name)}</div><div style="font-size:11px;color:var(--muted)">${esc(l.phone||l.email||"")}</div></td><td style="font-size:12px">${src}</td><td style="font-size:12px;color:var(--muted)">${esc(l.service||"—")}</td><td class="num">${l.amount?fmtINR(l.amount):"—"}</td><td><span class="chip ${leadChipCls(l.status)}">${LEAD_STATUS_LABEL[l.status]}</span></td><td style="font-size:12px;white-space:nowrap">${nf}</td><td class="no-print" style="text-align:right;white-space:nowrap"><button class="btn sm ghost" data-action="openLead" data-id="${l.id}">Open</button><button class="x" data-action="editLead" data-id="${l.id}" title="Edit">${I.edit}</button><button class="x" data-action="delLead" data-id="${l.id}" title="Delete">${I.trash}</button></td></tr>`;
  }).join("");
  return stats+tabBar+head+`<div class="card" style="padding:6px 6px 2px">${list.length?`<table><thead><tr><th>Lead</th><th>Source</th><th>Service</th><th>Budget</th><th>Status</th><th>Next f/up</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">No leads in this stage.</div>`}</div>`;
}
function leadDetail(id){
  const l=state.leads.find(x=>x.id===id);if(!l){state.openLead=null;return vLeads()}
  const fups=[...(l.followups||[])].sort((a,b)=>b.date.localeCompare(a.date));

ertLead" data-id="${l.id}" style="margin-top:10px">★ Convert to client</button>`:`<span class="chip paid" style="margin-top:10px;display:inline-block">Converted</span>`}</div></div>

  const pendingNet=active.filter(m=>!isSalaryPaid(m.id,mk)).reduce((s,m)=>s+payrollFor(m,mk).net,0);

  const rows=active.map(m=>{
    const p=payrollFor(m,mk);const paid=isSalaryPaid(m.id,mk);

    const stat=`<span style="font-size:11.5px;color:var(--muted)">P ${p.P} · L ${p.L} · H ${p.H} · A ${p.A}</span>${p.dedDays?`<div style="font-size:11px;color:var(--amber)">−${p.dedDays} day${p.dedDays!==1?"s":""} cut${p.lateCut?` (4-late rule: ${p.lateCut})`:""}</div>`:`<div style="font-size:11px;color:var(--green)">full salary</div>`}`;

  }).join("");

  // quick mark today

    const cur=state.attendance[m.id+"|"+tdy]||"";

  }).join(""):`<div class="empty">Switch to the current month to mark today's attendance.</div>`;

  return `
  <div class="grid cards">
    ${statCard("Team size",String(active.length),"active members")}
    ${statCard("Net payable · "+mkLabel(mk).split(" ")[0],fmtINR(totalNet),"after attendance")}
    ${statCard("Paid this month",fmtINR(paidNet),"")}
    ${statCard("Still pending",fmtINR(pendingNet),"")}
  </div>

  <div class="section-head">
    <span style="display:flex;align-items:center;gap:12px"><span class="eyebrow">Payroll</span>
      <span class="month-nav no-print"><button data-action="teamMonth" data-dir="-1">‹</button><span class="m">${mkLabel(mk)}</span><button data-action="teamMonth" data-dir="1">›</button></span></span>
    <button class="btn sm primary no-print" data-action="addMember">＋ Add member</button>
  </div>

  </div>
  <div class="legend"><span><i style="background:var(--green)"></i>P present</span><span><i style="background:var(--amber)"></i>L late (4 = 1 day cut)</span><span><i style="background:var(--blue)"></i>H half day (½ cut)</span><span><i style="background:var(--red)"></i>A absent (1 day cut)</span><span><i style="background:var(--muted)"></i>W week-off / leave</span></div>

function attModal(mid){
  const m=state.team.find(x=>x.id===mid);if(!m)return;
  const mk=state.teamMonth||monthKey(today());
  attDraft={mid,mk,map:{}};
  const dim=daysInMonth(mk);const[y,mo]=mk.split("-").map(Number);
  for(let dd=1;dd<=dim;dd++){const ds=`${y}-${String(mo).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;const v=state.attendance[mid+"|"+ds];if(v)attDraft.map[ds]=v}
  openModal(`<div class="mh"><h3>${esc(m.name)} · ${mkLabel(mk)}</h3><button class="x" data-action="closeModal">✕</button></div>
    <div class="mb"><div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><button class="btn sm ghost" data-action="attAll" data-v="P">Mark all present</button><button class="btn sm ghost" data-action="attAll" data-v="">Clear month</button><span style="font-size:11.5px;color:var(--muted);align-self:center">Tap a day to cycle: P → L → H → A → W</span></div><div id="attBody">${attGrid()}</div></div>
    <div class="mf"><button class="btn ghost" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveAtt">Save attendance</button></div>`,true);
}
function attGrid(){
  const {mk,map,mid}=attDraft;const dim=daysInMonth(mk);const[y,mo]=mk.split("-").map(Number);
  const first=new Date(y,mo-1,1).getDay();const tdy=iso(today());
  const dows=["S","M","T","W","T","F","S"].map(d=>`<div class="att-cell dow">${d}</div>`).join("");
  let cells="";for(let i=0;i<first;i++)cells+=`<div></div>`;
  for(let dd=1;dd<=dim;dd++){const ds=`${y}-${String(mo).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;const v=map[ds]||"";const fut=ds>tdy?"future":"";
    cells+=`<div class="att-cell ${v?"att-"+v:""} ${fut}" data-action="cycleAtt" data-d="${ds}"><span class="dnum">${dd}</span><span class="mk">${v||"·"}</span></div>`}
  const m=state.team.find(x=>x.id===mid);
  const tmp={...state}; // compute live preview using draft
  const cnt={P:0,L:0,H:0,A:0,W:0};Object.values(map).forEach(v=>cnt[v]!==undefined&&cnt[v]++);
  const perDay=m.salary/dim;const ded=cnt.A+cnt.H*0.5+Math.floor(cnt.L/4);const net=Math.max(0,Math.round(m.salary-perDay*ded));
  return `<div class="att-grid">${dows}${cells}</div>
    <div style="margin-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:12px;border-top:1px solid var(--line-soft)">
      <div style="font-size:12px;color:var(--muted)">P ${cnt.P} · L ${cnt.L} · H ${cnt.H} · A ${cnt.A} · W ${cnt.W}${ded?` · <span style="color:var(--amber)">−${ded} day${ded!==1?"s":""}</span>`:""}</div>
      <div style="font-size:12px">Net salary: <b class="num" style="font-family:var(--display);font-size:16px">${fmtINR(net)}</b></div>
    </div>`;
}

/* ---- INVOICES ---- */
function invTotal(i){return i.taxable+i.taxable*i.rate/100}
function invNo(){const t=today();const y=t.getFullYear();const fyStart=t.getMonth()>=3?y:y-1;const fy=`${fyStart}-${String((fyStart+1)%100).padStart(2,"0")}`;const n=state.invoices.length+1;return `IM/${fy}/G/${String(n).padStart(3,"0")}`}
function vInvoices(){
  const list=[...state.invoices].sort((a,b)=>b.date.localeCompare(a.date));
  const paid=list.filter(i=>i.status==="paid").reduce((s,i)=>s+invTotal(i),0);

  const rows=list.map(i=>`<tr class="row"><td style="font-weight:600">${esc(i.no)}</td><td>${esc(i.clientName)}</td><td style="color:var(--muted)">${fmtDate(i.date)}</td><td class="num">${fmtINR(i.taxable)}</td><td class="num" style="color:var(--muted)">${i.gstType==="inter"?"IGST":"CGST+SGST"} ${i.rate}%</td><td class="num" style="font-weight:600">${fmtINR(invTotal(i))}</td><td><span class="chip ${i.status==="paid"?"paid":"pending"}">${i.status}</span></td><td class="no-print" style="text-align:right;white-space:nowrap"><button class="btn sm ghost" data-action="viewInvoice" data-id="${i.id}">View</button>${i.status!=="paid"?`<button class="btn sm green" data-action="markInvoicePaid" data-id="${i.id}">Mark paid</button>`:""}<button class="x" data-action="editInvoice" data-id="${i.id}" title="Edit">${I.edit}</button><button class="x" data-action="dupInvoice" data-id="${i.id}" title="Duplicate for next period">⎘</button><button class="x" data-action="delInvoice" data-id="${i.id}" title="Delete">${I.trash}</button></td></tr>`).join("");
  return `<div class="grid cards" style="grid-template-columns:repeat(3,1fr)">${statCard("Invoiced & paid",fmtINR(paid),"")}${statCard("Outstanding",fmtINR(due),`${list.filter(i=>i.status!=="paid").length} unpaid`)}${statCard("Total invoices",String(list.length),"")}</div>

    <div class="card" style="padding:6px 6px 2px">${list.length?`<table><thead><tr><th>No.</th><th>Client</th><th>Date</th><th>Taxable</th><th>GST</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty"><div class="big">No invoices yet</div>Create a GST invoice for any client.</div>`}</div>`;
}

  const catRows=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([l,v],i)=>({label:l,value:v,color:PALETTE[i%PALETTE.length]}));

me||"Incinc Media")} (Current A/c)<br>Bank: ${esc(B.bankName||"")} &nbsp;&middot;&nbsp; A/c No.: ${esc(B.bankAcct||"")}<br>IFSC: ${esc(B.bankIfsc||"")}${B.branch?` &nbsp;&middot;&nbsp; Branch: ${esc(B.branch)}`:""}${B.upi?`<br>UPI: ${esc(B.upi)}`:""}</div></div><div class="invsign"><div class="sg">For ${esc(B.name||"Incinc Media")}</div><div style="flex:1"></div><div>Authorised Signatory / Proprietor</div></div></div></div>`;

/* ---- global search ---- */
function gsResults(q){
  q=String(q||"").toLowerCase().trim();
  if(!q)return `<div class="empty" style="padding:22px">Type to search clients, leads, invoices, team & transactions.</div>`;
  const hit=s=>String(s||"").toLowerCase().includes(q);
  const out=[];
  const row=(icon,t1,t2,attrs)=>`<div class="gs-item" ${attrs}><div class="ico">${icon}</div><div class="txt"><div class="t1">${t1}</div><div class="t2">${t2}</div></div></div>`;
  state.clients.filter(c=>hit(c.name)||hit(c.company)||hit(c.phone)||hit(c.email)).slice(0,5).forEach(c=>out.push(row(I.clients,esc(c.name),"Client · "+esc(c.company||c.industry||""),`data-action="gsGo" data-view="clients" data-id="${c.id}"`)));
  (state.leads||[]).filter(l=>hit(l.name)||hit(l.phone)||hit(l.service)).slice(0,5).forEach(l=>out.push(row(I.leads,esc(l.name),"Lead · "+(LEAD_STATUS_LABEL[l.status]||l.status)+(l.service?" · "+esc(l.service):""),`data-action="gsGo" data-view="leads" data-id="${l.id}"`)));
  state.invoices.filter(i=>hit(i.no)||hit(i.clientName)).slice(0,5).forEach(i=>out.push(row(I.invoices,esc(i.no),"Invoice · "+esc(i.clientName)+" · "+fmtINR(invTotal(i)),`data-action="gsGo" data-view="invoices" data-inv="${i.id}"`)));
  state.team.filter(m=>hit(m.name)||hit(m.department)).slice(0,5).forEach(m=>out.push(row(I.team,esc(m.name),"Team · "+esc(m.department),`data-action="gsGo" data-view="team"`)));
  state.transactions.filter(t=>hit(t.client)||hit(t.category)||hit(t.desc)||hit(t.sub)||hit(t.source)||hit(String(t.amount))).slice(0,5).forEach(t=>out.push(row(I.ledger,(t.type==="income"?"+":t.type==="expense"?"−":"⇄")+fmtINR(t.amount)+" · "+esc(t.client||t.category||"Transfer"),"Ledger · "+fmtDateY(t.date),`data-action="gsGo" data-view="ledger" data-q="${esc(q)}"`)));
  return out.length?out.join(""):`<div class="empty" style="padding:22px">No matches for \u201c${esc(q)}\u201d.</div>`;
}

/* ---- actions ---- */
async function handleAction(action,ds){
  switch(action){

    case "addIncome": incomeForm(); break;
    case "transfer": transferForm(); break;

    case "addRecur": recurForm(); break;
    case "addInvoice": if(!state.clients.length){toast("Add a client first");break} invoiceForm(); break;
    case "closeModal": closeModal(); break;
    case "openClient": state.openClient=ds.id; state.view="clients"; await save(); render(); break;
    case "closeClient": state.openClient=null; render(); break;
    case "viewInvoice": viewInvoice(ds.id); break;
    case "print": window.print(); break;

    case "saveExpense":{const amt=+($("#ex_amount").value||0);if(amt<=0){toast("Enter an amount");break}const acct=pickedAcct("ex_acct")||"current";const cat=$("#ex_cat").value;const o={date:$("#ex_date").value,time:$("#ex_time").value,accountId:acct,amount:amt,category:cat,sub:$("#ex_sub").value,desc:$("#ex_desc").value,group:PERSONAL_CATS.includes(cat)?"personal":"business"};if(ds.id){const t=state.transactions.find(x=>x.id===ds.id);if(t)Object.assign(t,o)}else state.transactions.push({id:uid(),type:"expense",...o});await save();closeModal();render();toast(ds.id?"Expense updated":"Expense saved");break}
    case "saveIncome":{const amt=+($("#in_amount").value||0);if(amt<=0){toast("Enter an amount");break}const acct=pickedAcct("in_acct")||"current";const client=($("#in_client").value||$("#in_client_sel").value||"").trim();const o={date:$("#in_date").value,time:$("#in_time").value,accountId:acct,amount:amt,source:$("#in_source").value,category:$("#in_source").value,client,service:$("#in_service").value,invoiceNo:$("#in_inv").value,gst:$("#in_gst").value==="true",pending:+($("#in_pending").value||0)};if(ds.id){const t=state.transactions.find(x=>x.id===ds.id);if(t)Object.assign(t,o)}else state.transactions.push({id:uid(),type:"income",desc:"",...o});await save();closeModal();render();toast(ds.id?"Income updated":"Income saved");break}
    case "saveTransfer":{const amt=+($("#tr_amount").value||0);if(amt<=0){toast("Enter an amount");break}const from=pickedAcct("tr_from"),to=pickedAcct("tr_to");if(from===to){toast("Pick two different accounts");break}const o={date:$("#tr_date").value,accountId:from,toAccountId:to,amount:amt,desc:$("#tr_reason").value};if(ds.id){const t=state.transactions.find(x=>x.id===ds.id);if(t)Object.assign(t,o)}else state.transactions.push({id:uid(),type:"transfer",time:nowTime(),...o});await save();closeModal();render();toast(ds.id?"Transfer updated":"Transfer recorded");break}
    case "saveClient":{const name=$("#c_name").value.trim();if(!name){toast("Enter a client name");break}const o={name,company:$("#c_company").value,phone:$("#c_phone").value,email:$("#c_email").value,gst:$("#c_gst").value,pan:$("#c_pan").value,industry:$("#c_industry").value,address:$("#c_address").value,status:$("#c_status").value,notes:$("#c_notes").value};if(ds.id){const c=state.clients.find(x=>x.id===ds.id);if(c)Object.assign(c,o)}else state.clients.push({id:uid(),...o,services:[]});await save();closeModal();render();toast(ds.id?"Client updated":"Client added");break}
    case "saveService":{const c=state.clients.find(x=>x.id===ds.cid);if(!c)break;const price=+($("#s_price").value||0),pt=$("#s_ptype").value;if(ds.sid){const s=(c.services||[]).find(y=>y.id===ds.sid);if(s){s.name=$("#s_name").value;s.start=$("#s_start").value;s.price=price;s.paymentType=pt}await save();closeModal();render();toast("Service updated");break}const adv=+($("#s_adv").value||0);const svc={id:uid(),name:$("#s_name").value,start:$("#s_start").value,price,advance:adv,paymentType:pt,installments:[]};if(adv>0)svc.installments.push({id:uid(),amount:adv,due:$("#s_start").value,paid:$("#s_start").value,status:"paid"});if(pt==="installments"){const n=Math.max(1,+($("#s_ninst").value||1)),rem=Math.max(0,price-adv),each=Math.round(rem/n);let first=new Date($("#s_firstdue").value||today());for(let k=0;k<n;k++)svc.installments.push({id:uid(),amount:k===n-1?rem-each*(n-1):each,due:iso(addMonths(first,k)),paid:null,status:"pending"})}else if(pt==="retainer")svc.installments.push({id:uid(),amount:price,due:iso(addMonths(today(),1)),paid:null,status:"pending"});else if(price-adv>0)svc.installments.push({id:uid(),amount:price-adv,due:$("#s_start").value,paid:null,status:"pending"});c.services=c.services||[];c.services.push(svc);await save();closeModal();render();toast("Service added");break}
    case "markPaid":{const c=state.clients.find(x=>x.id===ds.cid),s=c&&c.services.find(y=>y.id===ds.sid),i=s&&s.installments.find(z=>z.id===ds.iid);if(!i)break;i.status="paid";i.paid=iso(today());state.transactions.push({id:uid(),type:"income",date:iso(today()),time:nowTime(),accountId:"current",amount:i.amount,source:"Client Payment",category:"Client Payment",client:c.name,service:s.name,invoiceNo:"",gst:!!c.gst,pending:0,desc:"Installment payment"});await save();render();toast(`${fmtINR(i.amount)} received from ${c.name}`);break}
    case "markInvoicePaid":{const i=state.invoices.find(x=>x.id===ds.id);if(!i)break;i.status="paid";state.transactions.push({id:uid(),type:"income",date:iso(today()),time:nowTime(),accountId:"current",amount:invTotal(i),source:"Client Payment",category:"Client Payment",client:i.clientName,service:"",invoiceNo:i.no,gst:true,pending:0,desc:"Invoice "+i.no});await save();render();toast("Invoice marked paid");break}
    case "saveInvoice":{const cid=$("#iv_client").value,c=state.clients.find(x=>x.id===cid);if(!c){toast("Pick a client");break}const items=[];let k=0;while($("#iv_d"+k)){const desc=$("#iv_d"+k).value.trim();const hsn=$("#iv_h"+k).value.trim();const qty=+($("#iv_q"+k).value||0);const rate=+($("#iv_r"+k).value||0);if(desc&&(qty>0||rate>0))items.push({desc,hsn,qty:qty||1,rate});k++}if(!items.length){toast("Add at least one item");break}const taxable=items.reduce((s,it)=>s+it.qty*it.rate,0);const o={no:$("#iv_no").value||invNo(),clientId:cid,clientName:c.name,date:$("#iv_date").value,order:$("#iv_order").value||"Verbal",items,taxable,gstType:$("#iv_type").value,rate:+$("#iv_rate").value};if(ds.id){const iv=state.invoices.find(x=>x.id===ds.id);if(iv)Object.assign(iv,o)}else state.invoices.push({id:uid(),...o,status:"unpaid"});await save();closeModal();render();toast(ds.id?"Invoice updated":"Invoice created");break}

    /* team */
    case "teamMonth":{const d=addMonths(new Date((state.teamMonth||monthKey(today()))+"-01"),+ds.dir);state.teamMonth=monthKey(d);await save();render();break}
    case "saveMember":{const name=$("#m_name").value.trim();if(!name){toast("Enter a name");break}const o={name,department:$("#m_dept").value,salary:+($("#m_salary").value||0),joined:$("#m_join").value};if(ds.id){const m=state.team.find(x=>x.id===ds.id);if(m)Object.assign(m,o)}else state.team.push({id:uid(),...o,active:true});await save();closeModal();render();toast(ds.id?"Member updated":"Member added");break}
    case "openAtt": attModal(ds.mid); break;
    case "cycleAtt":{if(!attDraft)break;const cur=attDraft.map[ds.d]||"";const idx=ATT_ORDER.indexOf(cur);const next=ATT_ORDER[(idx+1)%ATT_ORDER.length];if(next)attDraft.map[ds.d]=next;else delete attDraft.map[ds.d];$("#attBody").innerHTML=attGrid();break}
    case "attAll":{if(!attDraft)break;const v=ds.v;const dim=daysInMonth(attDraft.mk);const[y,mo]=attDraft.mk.split("-").map(Number);const tdy=iso(today());attDraft.map={};if(v)for(let dd=1;dd<=dim;dd++){const dstr=`${y}-${String(mo).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;if(dstr<=tdy)attDraft.map[dstr]=v}$("#attBody").innerHTML=attGrid();break}
    case "saveAtt":{if(!attDraft)break;const dim=daysInMonth(attDraft.mk);const[y,mo]=attDraft.mk.split("-").map(Number);for(let dd=1;dd<=dim;dd++){const dstr=`${y}-${String(mo).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;const k=attDraft.mid+"|"+dstr;if(attDraft.map[dstr])state.attendance[k]=attDraft.map[dstr];else delete state.attendance[k]}await save();closeModal();render();toast("Attendance saved");break}

    case "paySalary":{const m=state.team.find(x=>x.id===ds.mid);if(!m)break;const mk=state.teamMonth||monthKey(today());const p=payrollFor(m,mk);openModal(`<div class="mh"><h3>Pay salary · ${esc(m.name)}</h3><button class="x" data-action="closeModal">✕</button></div><div class="mb"><div style="font-size:13px;line-height:1.7"><div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Month</span><b>${mkLabel(mk)}</b></div><div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Base salary</span><span class="num">${fmtINR(m.salary)}</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Attendance</span><span>P ${p.P} · L ${p.L} · H ${p.H} · A ${p.A}</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Deduction</span><span class="num" style="color:var(--amber)">−${fmtINR(Math.round(p.perDay*p.dedDays))} (${p.dedDays} day${p.dedDays!==1?"s":""})</span></div><div style="display:flex;justify-content:space-between;border-top:1px solid var(--line-soft);margin-top:8px;padding-top:8px"><b>Net payable</b><b class="num" style="font-family:var(--display);font-size:18px">${fmtINR(p.net)}</b></div></div><div style="font-size:11.5px;color:var(--muted);margin-top:12px">This records a Staff Salary expense of ${fmtINR(p.net)} from <b>HDFC Current</b>.</div></div><div class="mf"><button class="btn ghost" data-action="closeModal">Cancel</button><button class="btn green" data-action="confirmPay" data-mid="${m.id}">Pay ${fmtINR(p.net)}</button></div>`);break}

    case "delRecur":{state.recurring=state.recurring.filter(r=>r.id!==ds.id);await save();render();toast("Removed");break}

function download(name,text,mime){const b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

  const t=e.target.closest("[data-action]");

});

  if(f&&f.files&&f.files[0]){

    rd.onload=()=>{try{const data=JSON.parse(rd.result);if(!data||!data.accounts||!data.transactions)throw 0;pendingImport=data;openModal(`<div class="mh"><h3>Restore this backup?</h3><button class="x" data-action="closeModal">✕</button></div><div class="mb">This replaces <b>all</b> current data in this browser with the backup file. Export a backup of your current data first if you're unsure.</div><div class="mf"><button class="btn ghost" data-action="closeModal">Cancel</button><button class="btn red" data-action="confirmImport">Restore backup</button></div>`)}catch(err){toast("That doesn't look like a valid backup")}};
    rd.readAsText(file);f.value="";
  }
});
